name: Publicar y actualizar Nebula Arena
on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: 'SHA de la imagen a desplegar (vacío usa el commit actual; indica un SHA previo para rollback)'
        required: false
        default: ''
permissions:
  contents: read
jobs:
  deploy:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment: nebula-cloud
    concurrency: nebula-cloud
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    env:
      REGISTRY: ${{ vars.GCP_REGION }}-docker.pkg.dev
      DEPLOY_TAG: ${{ inputs.target_sha != '' && inputs.target_sha || github.sha }}
      IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT }}/nebula/nebula-server:${{ inputs.target_sha != '' && inputs.target_sha || github.sha }}
      NAMESPACE: ${{ vars.NEBULA_NAMESPACE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Pruebas unitarias y smoke test de partida
        run: |
          python -m pip install -r server/requirements-dev.txt
          python -m pytest server/test_server.py -q
          docker build -t "$IMAGE" server
          docker run -d --name nebula-smoke -p 7654:7654 -p 9100:9100 "$IMAGE"
          sleep 2
          python server/smoke.py
          docker rm -f nebula-smoke
      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Publicar imagen inmutable por SHA en Artifact Registry
        if: inputs.target_sha == ''
        run: |
          gcloud auth configure-docker "$REGISTRY" --quiet
          docker push "$IMAGE"
      - uses: google-github-actions/get-gke-credentials@v3
        with:
          cluster_name: ${{ vars.GKE_CLUSTER }}
          location: ${{ vars.GKE_LOCATION }}
      - name: Actualizar Fleet de Agones (drenado seguro de partidas Allocated)
        run: |
          test -n "$NAMESPACE"
          PREV_IMAGE=$(kubectl -n "$NAMESPACE" get fleet nebula-fleet -o jsonpath='{.spec.template.spec.template.spec.containers[0].image}')
          echo "Imagen previa en Fleet (para rollback): $PREV_IMAGE"
          patch=$(jq -cn --arg image "$IMAGE" '[{op:"test",path:"/spec/template/spec/template/spec/containers/0/name",value:"nebula"},{op:"replace",path:"/spec/template/spec/template/spec/containers/0/image",value:$image}]')
          kubectl -n "$NAMESPACE" patch fleet nebula-fleet --type=json -p "$patch"
          kubectl -n "$NAMESPACE" get fleet nebula-fleet
          kubectl -n "$NAMESPACE" get gameservers
